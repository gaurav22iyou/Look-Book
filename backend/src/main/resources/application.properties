# ===================================================================
# BookNow - Core Application Configuration
# Common settings shared across all environments
# ===================================================================
spring.application.name=booknow

# Default Server Port (Render supplies PORT environment variable dynamically)
server.port=${PORT:8080}

# JPA Common Settings
spring.jpa.open-in-view=false

# Allowed CORS Origins (configurable via environment variable)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://look-book-frontend-eopf.onrender.com}

# Default seed user credentials (can be overridden via environment variables)
app.users.user1.password=${USER1_PASSWORD:user1pass}
app.users.user2.password=${USER2_PASSWORD:user2pass}
app.users.admin.password=${ADMIN_PASSWORD:adminpass}
