# ===================================================================
# BookNow - Local Development Profile: 'local'
# Local PostgreSQL Database Configuration
# ===================================================================

# PostgreSQL Datasource Configuration
# JDBC URL format: jdbc:postgresql://localhost:5432/booknow_db
# Overridable via environment variables: LOCAL_DB_URL, LOCAL_DB_USERNAME, LOCAL_DB_PASSWORD
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://${LOCAL_DB_HOST:localhost}:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:booknow_db}}
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration for Local Development
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.example.bookingsystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
