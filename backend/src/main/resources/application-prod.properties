# ===================================================================
# BookNow - Production Profile: 'prod'
# Production PostgreSQL Database Configuration (Render)
# ===================================================================

# Production DataSource configuration from environment variables:
# DB_URL, DB_USERNAME, DB_PASSWORD
# Note: If Render provides a connection string starting with postgresql:// or postgres://,
# DatabaseUrlEnvironmentPostProcessor converts it automatically to a valid JDBC URL
# (jdbc:postgresql://...) and extracts credentials if embedded in the URL.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration for Production
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration for Production
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Production Logging
logging.level.root=INFO
logging.level.com.example.bookingsystem=INFO
